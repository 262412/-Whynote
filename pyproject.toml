[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whynote"
version = "0.1.0"
description = "知因・Whynote negative feedback attribution foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff==0.16.9", "uvicorn>=0.34,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/whynote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency injection uses Depends in defaults.
