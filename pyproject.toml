[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whynote"
version = "0.1.0"
description = "知因・Whynote negative feedback attribution foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "uvicorn>=0.34,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/whynote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
